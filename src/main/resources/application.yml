server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: seckill
  
  # Thymeleaf 模板引擎配置
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false  # 开发环境关闭缓存，生产环境改为 true

  # 数据源配置（暂时注释，等创建数据库后再启用）
  # datasource:
  #   driver-class-name: com.mysql.cj.jdbc.Driver
  #   url: jdbc:mysql://localhost:3306/seckill?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
  #   username: root
  #   password: root

  # Redis配置
  data:
    redis:
      host: 192.168.31.16
      port: 6379
      password: Pass123456788
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

