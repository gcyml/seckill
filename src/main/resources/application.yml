server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: seckill

  # Thymeleaf 模板引擎配置
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false  # 开发环境关闭缓存，生产环境改为 true

  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.31.16:3306/seckill?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: seckill
    password: Pass@123456788
    hikari:
      # 连接池配置（优化后）
      minimum-idle: 20
      maximum-pool-size: 100
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
      # 性能优化配置
      leak-detection-threshold: 60000
      # 连接池名称
      pool-name: SeckillHikariPool

  # Redis配置
  data:
    redis:
      host: 192.168.31.16
      port: 6379
      password: Pass123456788
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 10
          max-wait: -1ms

  # RabbitMQ配置
  rabbitmq:
    host: 192.168.31.16
    port: 5672
    username: seckill
    password: 123456788
    virtual-host: seckill
    # 连接超时时间
    connection-timeout: 15000
    # 发布确认配置
    publisher-confirm-type: correlated
    publisher-returns: true
    # 消费者配置（优化后）
    listener:
      simple:
        # 确认模式：manual(手动确认)、auto(自动确认)、none(不确认)
        # 使用手动确认，保证数据不丢失（处理成功后立即确认，性能影响很小）
        acknowledge-mode: manual
        # 预取数量（每个消费者最多预取的消息数）- 增加以提高吞吐量
        prefetch: 50
        # 并发消费者数量 - 大幅增加以提高数据库处理能力
        concurrency: 20
        # 最大并发消费者数量 - 根据数据库连接池大小调整
        max-concurrency: 50
        # 是否重试
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 1.0

# MyBatis Plus 配置
mybatis-plus:
  # Mapper XML 文件位置
  mapper-locations: classpath*:/mapper/**/*.xml
  # 实体类包路径
  type-aliases-package: com.seckill.entity
  configuration:
    # 开启驼峰命名转换
    map-underscore-to-camel-case: true
    # 日志实现
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 主键类型：AUTO(数据库自增)、ASSIGN_ID(雪花算法)、ASSIGN_UUID(UUID)
      id-type: ASSIGN_ID
      # 逻辑删除字段
      logic-delete-field: deleted
      # 逻辑删除值
      logic-delete-value: 1
      # 逻辑未删除值
      logic-not-delete-value: 0
      # 字段策略：IGNORED(忽略判断)、NOT_NULL(非NULL判断)、NOT_EMPTY(非空判断)
      insert-strategy: NOT_NULL
      update-strategy: NOT_NULL

# 日志配置（详细配置在 logback-spring.xml 中）
logging:
  config: classpath:logback-spring.xml
  level:
    root: INFO
    com.secskill: DEBUG
    com.baomidou.mybatisplus: DEBUG
    org.springframework: INFO
    org.mybatis: DEBUG

